version: '3.8'

services:
  # --- Módulo de Back-end (FastAPI) ---
  api:
    build: .
    container_name: vera_api
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Conecta ao postgres na rede interna e ao Ollama no host via host.docker.internal
      - POSTGRES_SERVER=postgres
      - LLM_ENDPOINT_URL=http://host.docker.internal:11435

  # --- Banco de Dados Relacional (PostgreSQL) ---
  postgres:
    image: postgres:15
    container_name: vera_postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

  # --- Módulo de Front-end (React + Vite + Nginx) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vera_frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - api